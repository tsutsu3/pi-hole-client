services:
  caddy:
    container_name: caddy
    image: caddy:latest
    ports:
      - "1447:8443"
      - "1448:8444"
      - "1450:8445"
      - "8090:8090"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs-dev:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - piholeV6
      - piholeV5
      - piholeV6-subroute

  piholeV5:
    container_name: piholeV5
    image: pihole/pihole:2024.07.0
    ports:
      - "54:53/tcp"
      - "54:53/udp"
      - "8080:80/tcp"
      - "1443:443/tcp"
    environment:
      TZ: 'Asia/Tokyo'
      WEBPASSWORD: 'test123'

  piholeV6:
    container_name: piholeV6
    image: pihole/pihole:latest
    ports:
      - "55:53/tcp"
      - "55:53/udp"
      - "80:80/tcp"
      - "443:443/tcp"
    environment:
      TZ: 'Asia/Tokyo'
      FTLCONF_webserver_api_password: 'test001'

  piholeV6-subroute:
    container_name: piholeV6-subroute
    image: pihole/pihole:latest
    ports:
      - "59:53/tcp"
      - "59:53/udp"
    expose:
      - "80"
    environment:
      TZ: 'Asia/Tokyo'
      FTLCONF_webserver_api_password: 'test001'
      FTLCONF_webserver_paths_prefix: '/pihole'

  piholeV62:
    container_name: piholeV62
    image: pihole/pihole:2025.08.0
    ports:
      - "56:53/tcp"
      - "56:53/udp"
      - "8081:80/tcp"
      - "1444:443/tcp"
    environment:
      TZ: 'Asia/Tokyo'
      FTLCONF_webserver_api_password: 'test002'

  piholeV63:
    container_name: piholeV63
    image: pihole/pihole:2025.02.7
    ports:
      - "57:53/tcp"
      - "57:53/udp"
      - "8082:80/tcp"
      - "1445:443/tcp"
    environment:
      TZ: 'Asia/Tokyo'
      FTLCONF_webserver_api_password: 'test003'

  piholeV6dev:
    container_name: piholeV6dev
    image: pihole/pihole:nightly
    ports:
      - "58:53/tcp"
      - "58:53/udp"
      - "8083:80/tcp"
      - "1446:443/tcp"
    environment:
      TZ: 'Asia/Tokyo'
      FTLCONF_webserver_api_password: 'test000'

volumes:
  caddy_data:
  caddy_config: