<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>404 | Pi-hole client</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #ffffff;
        color: #18181b;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background-color: #ffffff;
        background-size: 14px 24px;
      }

      main {
        padding: 5rem 1.5rem 6rem;
        text-align: center;
      }

      .code {
        margin: 0;
        background: linear-gradient(90deg, #f43f5e, #3b82f6);
        background-clip: text;
        color: transparent;
        font-size: clamp(5rem, 22vw, 9rem);
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1;
      }

      a {
        display: inline-block;
        margin-top: 2rem;
        color: #2563eb;
        font-size: 1.05rem;
      }

      a:hover {
        color: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code" aria-label="404">404</p>
      <a href="https://pi-hole-client.tsutsu3.com/">https://pi-hole-client.tsutsu3.com/</a>
    </main>
  </body>
</html>
